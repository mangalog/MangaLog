<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111218"><title>MangaLog · Social (test)</title><style>
:root{font:16px system-ui,sans-serif;color:#f5f5f8;background:#0e1016}*{box-sizing:border-box}body{margin:0}header{background:#171820;border-bottom:1px solid #353640;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:#ff7184}main{max-width:900px;margin:auto;padding:24px 16px 100px}.panel{background:#191b23;border:1px solid #353640;border-radius:16px;padding:20px;margin:16px 0}h1{font-size:30px}h2{font-size:20px}.muted{color:#b7b8c3}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.stack{display:grid;gap:10px}input,textarea,select{background:#101118;border:1px solid #4b4c59;border-radius:9px;color:white;padding:12px;width:100%;font:inherit}button{border:1px solid #5b3540;background:#ef4357;color:white;border-radius:9px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#292b35;border-color:#50515d}button:disabled{opacity:.5;cursor:wait}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button.active{background:#ef4357}.tabs button{background:#292b35}.hidden{display:none!important}.item{border-top:1px solid #373944;padding:14px 0}.error{color:#ff98a5}.ok{color:#95e0b3}small{color:#b7b8c3}label{display:grid;gap:6px}textarea{min-height:100px;resize:vertical}@media(max-width:500px){header{align-items:flex-start}h1{font-size:25px}}
</style></head><body><header><strong>MangaLog <span style="color:#ff6678">Social · TEST</span></strong><a href="./index.html">← Torna a MangaLog</a></header><main><h1>La community dei collezionisti</h1><p class="muted">Ambiente di sviluppo. La collezione resta privata e non viene condivisa da questa pagina.</p><div id="status" role="status" class="panel">Verifica configurazione…</div><section id="app" class="hidden"><div class="tabs"><button data-tab="profile" class="active">Profilo</button><button data-tab="people">Persone</button><button data-tab="requests">Amicizie</button><button data-tab="feed">Feed</button></div><div id="view"></div></section></main>
<script src="./cloud-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(()=>{'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),status=$('#status');let db,user,profile,tab='profile',busy=false;
const config=window.MANGALOG_CLOUD_CONFIG||window.MANGALOG_SUPABASE_CONFIG||window.MANGALOG_CLOUD||{};
const url=config.supabaseUrl||config.url||window.MANGALOG_SUPABASE_URL;
const key=config.supabaseAnonKey||config.anonKey||config.supabaseKey||window.MANGALOG_SUPABASE_ANON_KEY;
const msg=(s,error=false)=>{status.textContent=s;status.className='panel '+(error?'error':'ok')};
async function run(fn){if(busy)return;busy=true;try{await fn()}catch(e){msg(e.message||'Operazione non riuscita',true)}finally{busy=false}}
async function query(table,method='select',arg){let q=db.from(table);if(method==='insert')q=q.insert(arg);if(method==='update')q=q.update(arg.value).eq(arg.key,arg.id);if(method==='delete')q=q.delete().eq(arg.key,arg.id);if(method==='select')q=q.select(arg||'*');const {data,error}=await q;if(error)throw error;return data}
async function loadProfile(){const {data,error}=await db.from('social_profiles').select('*').eq('user_id',user.id).maybeSingle();if(error)throw error;profile=data}
const buttons=()=>document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
async function render(){buttons();if(tab==='profile')return profileView();if(tab==='people')return peopleView();if(tab==='requests')return requestsView();return feedView()}
function profileView(){$('#view').innerHTML='<section class="panel"><h2>Il tuo profilo</h2><form id="profileForm" class="stack"><label>Nickname (3–24 caratteri, lettere minuscole, numeri o _)<input name="username" required minlength="3" maxlength="24" pattern="[a-z0-9_]{3,24}" value="'+esc(profile?.username||'')+'"></label><label>Nome visualizzato<input name="display_name" required maxlength="60" value="'+esc(profile?.display_name||'')+'"></label><label>Biografia<textarea name="bio" maxlength="300">'+esc(profile?.bio||'')+'</textarea></label><label>Visibilità collezione<select name="collection_visibility"><option value="private">Privata</option><option value="friends">Solo amici (non ancora attivo)</option><option value="public">Pubblica (non ancora attivo)</option></select></label><small>La condivisione dei volumi non è ancora abilitata: cambiare la preferenza non pubblica i dati.</small><button>Salva profilo</button></form></section>';$('#profileForm').collection_visibility.value=profile?.collection_visibility||'private';$('#profileForm').onsubmit=e=>{e.preventDefault();run(async()=>{const f=new FormData(e.target),value={user_id:user.id,username:String(f.get('username')).trim().toLowerCase(),display_name:String(f.get('display_name')).trim(),bio:String(f.get('bio')).trim(),collection_visibility:f.get('collection_visibility')};if(!value.display_name)throw Error('Inserisci il nome');const {error}=await db.from('social_profiles').upsert(value,{onConflict:'user_id'});if(error)throw error;await loadProfile();msg('Profilo salvato');await render()})}}
async function peopleView(){if(!profile){$('#view').innerHTML='<div class="panel">Crea prima il tuo profilo.</div>';return}$('#view').innerHTML='<section class="panel"><h2>Trova collezionisti</h2><input id="peopleSearch" placeholder="Cerca nickname" maxlength="24"><div id="peopleResults"></div></section>';$('#peopleSearch').oninput=()=>{const val=$('#peopleSearch').value.trim().toLowerCase();if(val.length<2){$('#peopleResults').textContent='Inserisci almeno 2 caratteri';return}run(async()=>{const {data,error}=await db.from('social_profiles').select('user_id,username,display_name').ilike('username','%'+val.replace(/[%_,]/g,'')+'%').neq('user_id',user.id).limit(20);if(error)throw error;$('#peopleResults').innerHTML=(data||[]).map(p=>'<div class="item row"><div><strong>'+esc(p.display_name)+'</strong><br><small>@'+esc(p.username)+'</small></div><button data-add="'+esc(p.user_id)+'">Richiedi amicizia</button></div>').join('')||'<p class="muted">Nessun utente trovato</p>';$('#peopleResults').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>run(async()=>{await query('social_friend_requests','insert',{sender_id:user.id,receiver_id:b.dataset.add});msg('Richiesta inviata');b.disabled=true}))})};}
async function requestsView(){if(!profile){$('#view').innerHTML='<div class="panel">Crea prima il tuo profilo.</div>';return}const {data,error}=await db.from('social_friend_requests').select('id,sender_id,receiver_id,status').or('sender_id.eq.'+user.id+',receiver_id.eq.'+user.id).limit(100);if(error)throw error;const ids=[...new Set((data||[]).flatMap(r=>[r.sender_id,r.receiver_id]))].filter(id=>id!==user.id);let names={};if(ids.length){const {data:people,error:err}=await db.from('social_profiles').select('user_id,username').in('user_id',ids);if(err)throw err;for(const p of people||[])names[p.user_id]=p.username}$('#view').innerHTML='<section class="panel"><h2>Richieste e amicizie</h2>'+((data||[]).map(r=>{const incoming=r.receiver_id===user.id,other=incoming?r.sender_id:r.receiver_id;return '<div class="item row"><span>@'+esc(names[other]||'Utente')+' · '+esc(r.status)+(incoming?' · ricevuta':' · inviata')+'</span><span>'+(incoming&&r.status==='pending'?'<button data-reply="'+esc(r.id)+'" data-response="accepted">Accetta</button> <button class="secondary" data-reply="'+esc(r.id)+'" data-response="declined">Rifiuta</button>':'')+' <button class="secondary" data-remove="'+esc(r.id)+'">Rimuovi</button></span></div>'}).join('')||'<p class="muted">Nessuna amicizia o richiesta.</p>')+'</section>';document.querySelectorAll('[data-reply]').forEach(b=>b.onclick=()=>run(async()=>{const {error}=await db.rpc('social_respond_to_request',{request_id:b.dataset.reply,response:b.dataset.response});if(error)throw error;await render()}));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>run(async()=>{await query('social_friend_requests','delete',{key:'id',id:b.dataset.remove});await render()}))}
async function feedView(){if(!profile){$('#view').innerHTML='<div class="panel">Crea prima il tuo profilo.</div>';return}const {data,error}=await db.from('social_posts').select('id,author_id,body,audience,created_at').order('created_at',{ascending:false}).limit(50);if(error)throw error;$('#view').innerHTML='<section class="panel"><h2>Scrivi un post</h2><form id="postForm" class="stack"><textarea name="body" maxlength="2000" required placeholder="Racconta il tuo ultimo acquisto manga…"></textarea><select name="audience"><option value="friends">Solo amici</option><option value="public">Pubblico</option></select><button>Pubblica</button></form></section><section class="panel"><h2>Feed</h2>'+((data||[]).map(p=>'<article class="item"><small>'+esc(new Date(p.created_at).toLocaleString('it-IT'))+' · '+esc(p.audience)+'</small><p>'+esc(p.body)+'</p>'+(p.author_id===user.id?'<button class="secondary" data-delete-post="'+esc(p.id)+'">Elimina</button>':'')+'</article>').join('')||'<p class="muted">Ancora nessun post visibile.</p>')+'</section>';$('#postForm').onsubmit=e=>{e.preventDefault();run(async()=>{const f=new FormData(e.target);await query('social_posts','insert',{author_id:user.id,body:String(f.get('body')).trim(),audience:f.get('audience')});msg('Post pubblicato');await render()})};document.querySelectorAll('[data-delete-post]').forEach(b=>b.onclick=()=>run(async()=>{await query('social_posts','delete',{key:'id',id:b.dataset.deletePost});await render()}))}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;run(render)});
(async()=>{try{if(!url||!key||!window.supabase){msg('Configurazione cloud non riconosciuta. Questa pagina richiede Supabase TEST e lo schema Social. Nessun dato è stato modificato.',true);return}db=window.supabase.createClient(url,key);const {data,error}=await db.auth.getUser();if(error||!data.user){msg('Accedi prima al tuo account MangaLog e poi torna qui.',true);return}user=data.user;await loadProfile();$('#app').classList.remove('hidden');msg('Account collegato. Usa solo un ambiente Supabase di TEST.');await render()}catch(e){msg('Social non ancora pronto: '+(e.message||'errore di configurazione'),true)}})();
})();
</script></body></html>
