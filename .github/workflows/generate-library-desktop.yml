name: Generate HD MangaLog library wallpapers
on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_library_desktop.py"
      - ".github/workflows/generate-library-desktop.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image library
        run: python -m pip install Pillow==11.3.0
      - name: Compose desktop assets from original MangaLog artwork
        run: python scripts/generate_library_desktop.py
      - name: Commit desktop artwork
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/library-blue-desktop.webp assets/library-red-desktop.webp assets/library-violet-desktop.webp assets/library-white-desktop.webp
          if ! git diff --cached --quiet; then
            git commit -m "Generate 2560x1440 desktop wallpapers from original assets"
            git push origin HEAD:main
          fi
