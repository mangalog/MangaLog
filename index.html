/* MangaLog v6: lista acquisti e wishlist evoluta */
.buy-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:17px 0 20px}
.buy-series{background:#17181e;border:1px solid #30313a;border-radius:16px;margin:13px 0;overflow:hidden}
.buy-series summary{display:flex;align-items:center;gap:14px;padding:17px 20px;cursor:pointer;list-style:none;user-select:none}
.buy-series summary::-webkit-details-marker{display:none}.buy-series summary:after{content:'⌄';color:#f65b6d;font-size:24px;margin-left:auto}
.buy-series[open] summary:after{content:'⌃'}.buy-series summary:hover{background:#202028}
.buy-series-content{padding:0 16px 17px;border-top:1px solid #30313a}
.buy-volume-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(182px,1fr));gap:10px;padding-top:16px}
.buy-volume{border:1px solid #383a43;border-radius:12px;background:#202127;padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px}
.buy-volume.queued{border-color:#914354;background:#2a1e25}
.buy-volume-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.buy-vol-num{font-weight:900;font-size:20px}.priority-tag{font-size:11px;border:1px solid #4a3541;color:#ff9aaa;border-radius:30px;padding:4px 9px;white-space:nowrap}
.priority-tag.high{background:#542331;border-color:#aa4255;color:#ffd0d6}.priority-tag.low{background:#292932;border-color:#444550;color:#afb0bd}
.buy-meta{font-size:12px;color:#b6aab0;min-height:18px;overflow-wrap:anywhere}
.buy-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}.buy-actions .btn{font-size:11px;padding:8px 9px;flex:1}
.buy-actions .btn.primary{flex:1.3}.buy-actions .btn.buy-check{background:#182b26;border-color:#3b6d58;color:#b9f4d4}
.buy-actions .btn:hover{filter:brightness(1.12)}
.wishlist-card{display:flex;flex-direction:column;gap:10px}.wishlist-card h3{font-size:19px;margin:0}.wishlist-card .wish-price{font-size:25px;font-weight:850}
.wish-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}.wish-tools .btn{flex:1;font-size:12px}
.detail-quicklink{display:inline-flex;align-items:center;gap:6px;margin-top:12px}
.helper-note{font-size:13px;color:#b0abb4;line-height:1.55}.highlight-amount{font-weight:850;color:#ff8997}

@media(max-width:350px){.buy-volume-grid{grid-template-columns:1fr}}

/* v6.1: Mancolista compatta, con numeri e menu a tendina per ogni serie */
.missing-intro{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:0 0 20px;flex-wrap:wrap}
.missing-intro p{margin:0;color:#a8a9b4;font-size:14px}
.missing-series{border:1px solid #30313a;border-radius:14px;background:#17181e;margin:11px 0;overflow:hidden}
.missing-series summary{display:flex;gap:13px;align-items:center;cursor:pointer;padding:16px 18px;list-style:none;user-select:none}
.missing-series summary::-webkit-details-marker{display:none}
.missing-series summary:after{content:'⌄';margin-left:auto;color:#f45164;font-size:24px;font-weight:600;line-height:1;transition:transform .14s}
.missing-series[open] summary:after{transform:rotate(180deg)}
.missing-series summary:hover{background:#202027}
.missing-series .missing-edition{font-size:12px;color:#9798a5;margin-top:4px}
.missing-series .missing-count{color:#f26879;font-weight:750;font-size:12px;border:1px solid #50303b;border-radius:30px;padding:6px 9px;white-space:nowrap}
.missing-number-list{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid #30313a;padding:17px 18px 20px}
.missing-number{display:grid;place-items:center;min-width:45px;height:44px;padding:0 9px;color:#f4f4f6;font-size:14px;font-weight:800;background:#25262e;border:1px solid #42434d;border-radius:9px;font-variant-numeric:tabular-nums}
.missing-number-list:empty:after{content:'Nessun volume mancante';color:#a8a9b4}
.missing-subtle-btn{border-color:#393b45!important;background:#191a20!important;color:#d7d7de!important}
@media(max-width:540px){.missing-series summary{padding:13px 11px;gap:9px}.missing-series .mini-cover{width:39px;height:49px}.missing-series .missing-count{font-size:11px;padding:5px 7px}.missing-number-list{padding:13px 12px 16px;gap:7px}.missing-number{min-width:43px;height:43px}}

/* v6.2 — Selezione provvisoria direttamente nella Mancolista. */
.missing-number{font-family:inherit;cursor:pointer;touch-action:manipulation;transition:background .14s,border-color .14s,transform .12s;position:relative}
.missing-number:hover{border-color:#ff6678;background:#32303a}
.missing-number:focus-visible{outline:3px solid #f88496;outline-offset:3px}
.missing-number.selected{color:#fff;background:#bb2d49;border-color:#ff7185;box-shadow:inset 0 0 0 1px #fd8494}
.missing-number.selected::after{content:'✓';font-size:9px;position:absolute;top:1px;right:4px;color:#fff}
.missing-number:active{transform:scale(.97)}
.missing-batch{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;position:sticky;top:10px;z-index:10;border:1px solid #884151;border-radius:14px;padding:11px 13px;background:#261922;box-shadow:0 8px 25px #05050582;margin:0 0 15px}
.missing-batch[hidden]{display:none!important}
.missing-batch-copy{color:#fff;font-weight:750;font-size:14px}
.missing-batch-copy small{display:block;color:#d0bfc3;font-size:11px;font-weight:400;margin-top:2px}
.missing-batch-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.missing-batch-actions .btn{white-space:nowrap}
.missing-success{padding:12px 14px;border-radius:12px;border:1px solid #436952;background:#15271c;color:#dcfce7;font-size:14px;margin:0 0 14px}
.missing-hint{font-size:12px;color:#aeb0bd;margin:0 0 15px}
@media(max-width:540px){.missing-batch{top:5px;padding:9px;gap:8px}.missing-batch-copy{font-size:12px}.missing-batch-actions{width:100%}.missing-batch-actions .btn.primary{flex:1}.missing-batch-actions .btn{font-size:12px;padding:9px 10px}}

/* v6.3 — Numeri ad alto contrasto e selezione rapida con mouse. */
#content .missing-number-list button.missing-number{
 color:#ffffff!important;-webkit-text-fill-color:#ffffff;
 background:#32343f;border:1px solid #626675;
 font-size:16px;font-weight:900;line-height:1;letter-spacing:.2px;
 user-select:none;-webkit-user-select:none;
}
#content .missing-number-list button.missing-number:hover{background:#424554;border-color:#ff7185}
#content .missing-number-list button.missing-number.selected{
 color:#ffffff!important;-webkit-text-fill-color:#ffffff;
 background:#cf3654;border-color:#ff8296;
 box-shadow:inset 0 0 0 1px #ff9bab;
}
/* La barra non sposta la griglia quando viene selezionato il primo volume. */
.missing-batch:not([hidden]){
 position:fixed;top:auto;bottom:23px;right:23px;left:auto;
 width:min(575px,calc(100vw - 46px));margin:0;z-index:25;
}
@media(max-width:800px){
 .missing-batch:not([hidden]){bottom:calc(75px + env(safe-area-inset-bottom));left:12px;right:12px;width:auto}
}
.main:has(.missing-batch:not([hidden])){padding-bottom:195px}
#content .missing-number-list.dragging,
#content .missing-number-list.dragging button.missing-number{cursor:crosshair;user-select:none;-webkit-user-select:none}

/* v7.1 — Pressione prolungata su Mancolista, con normale scroll prima dell’attivazione. */
#content .missing-number-list button.missing-number{-webkit-touch-callout:none;touch-action:auto}
#content .missing-number-list.dragging button.missing-number{outline-offset:2px}

/* v6.4 — Numerazione della collezione sempre leggibile sui pulsanti scuri. */
#content .volume-grid button.volume{color:#f8f8fb;-webkit-text-fill-color:#f8f8fb}
#content .volume-grid button.volume .volume-number{color:#ffffff;-webkit-text-fill-color:#ffffff;font-weight:900}
#content .volume-grid button.volume.owned{color:#ffffff;-webkit-text-fill-color:#ffffff}
#content .volume-grid button.volume:not(.owned) small{color:#c3c4cd;-webkit-text-fill-color:#c3c4cd}
#content .volume-grid button.volume.owned small{color:#ffb4bf;-webkit-text-fill-color:#ffb4bf}

.dashboard-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:15px}
.metric-tile{min-width:0;background:linear-gradient(145deg,#1e2028,#17181e);border:1px solid #31323e;border-radius:15px;padding:16px;display:flex;align-items:center;gap:12px}
.metric-icon{flex:0 0 39px;width:39px;height:39px;border-radius:11px;background:#47212e;color:#ff6076;display:grid;place-items:center;font-size:21px;font-weight:900}
.metric-tile:nth-child(2) .metric-icon{background:#21382e;color:#8bdeb1}.metric-tile:nth-child(3) .metric-icon{background:#202d40;color:#92b3f6}.metric-tile:nth-child(4) .metric-icon{background:#352743;color:#cba0ff}
.metric-number{font-size:26px;line-height:1.06;font-weight:950;color:#fff;overflow-wrap:anywhere}
.metric-caption{font-size:11px;color:#a4a5b2;margin-top:5px}
.dashboard-columns{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:15px;margin-top:19px}
.dashboard-panel{background:#18191f;border:1px solid #30323b;border-radius:17px;padding:20px;min-width:0}
.dashboard-panel h3{margin:0;font-size:17px;letter-spacing:-.2px}
.dashboard-panel .sub{color:#a1a2ae;font-size:12px;margin:5px 0 0;line-height:1.5}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.panel-head .btn{white-space:nowrap}
.overall-progress{height:12px;background:#35363e;border-radius:100px;overflow:hidden;margin:15px 0 9px}
.overall-progress>i{display:block;height:100%;background:linear-gradient(90deg,#f23650,#ff7990);border-radius:100px}
.progress-pair{display:flex;justify-content:space-between;gap:14px;color:#b8b8c2;font-size:12px;margin:7px 0}
.progress-pair strong{color:#fff}
.status-track{display:flex;height:13px;background:#31323b;border-radius:100px;overflow:hidden;margin:14px 0 14px}
.status-track .complete{background:#fe4c64}.status-track .started{background:#9b5370}.status-track .unstarted{background:#52545f}
.status-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#bfc0ca}
.status-legend b{color:#fff;font-weight:800}
.status-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:#fe4c64}
.status-legend .start i{background:#9b5370}.status-legend .none i{background:#52545f}
.dashboard-links{display:grid;gap:9px}
.dashboard-link{border:1px solid #34353e;background:#202129;border-radius:11px;padding:11px 12px;color:#fff;text-align:left;display:flex;gap:12px;align-items:center;width:100%}
.dashboard-link:hover,.dashboard-link:focus-visible{border-color:#fa6378;background:#29212b;outline:none}
.dash-cover{display:grid;place-items:center;width:43px;height:55px;border-radius:5px;background:linear-gradient(135deg,#673044,#261d28);font-weight:950;color:#ff8fa0;font-size:13px;flex-shrink:0}
.dash-link-main{min-width:0;flex:1}.dash-link-title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.dash-link-meta{font-size:11px;color:#9fa0ae;margin-top:5px}.dash-link-right{color:#ff6b7f;font-weight:850;font-size:13px;white-space:nowrap}
.dash-mini-progress{height:5px;background:#34353e;overflow:hidden;border-radius:12px;margin-top:8px}
.dash-mini-progress i{height:100%;background:#f64b64;display:block;border-radius:12px}
.activity-list{display:grid;gap:9px}
.activity-item{display:flex;gap:11px;align-items:center;border-bottom:1px solid #30313a;padding:4px 0 12px}.activity-item:last-child{border:0;padding-bottom:0}
.activity-symbol{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#2b2330;color:#ff8496;flex-shrink:0}
.activity-title{font-weight:750;font-size:13px;line-height:1.4}.activity-date{font-size:11px;color:#9697a5;margin-top:3px}
.section-link{border:0;background:transparent;color:#ff8191;font-size:12px;font-weight:800;padding:5px 0;cursor:pointer}
.stats-feature{display:grid;grid-template-columns:200px 1fr;align-items:center;gap:26px}
.stats-donut{width:175px;height:175px;border-radius:50%;position:relative;background:conic-gradient(#f44760 var(--pct),#3b3d47 0);display:grid;place-items:center;margin:auto}
.stats-donut:before{content:'';position:absolute;inset:24px;border-radius:50%;background:#18191f}
.stats-donut-center{position:relative;text-align:center}.stats-donut-center strong{display:block;font-weight:950;font-size:31px}.stats-donut-center small{display:block;font-size:11px;color:#a8a9b5}
.publisher-chart{display:grid;gap:18px}
.publisher-row{display:grid;grid-template-columns:minmax(75px,1.2fr) minmax(70px,3fr) auto;align-items:center;gap:14px}
.publisher-name{font-size:12px;color:#e1e1e6;overflow-wrap:anywhere}
.publisher-track{height:11px;background:#393a44;border-radius:99px;overflow:hidden;display:flex}
.publisher-track i{display:block;background:#fb526a;height:100%}.publisher-track em{display:block;background:#66515d;height:100%;font-style:normal}
.publisher-total{font-size:11px;color:#afb0bb;white-space:nowrap;text-align:right}
.stats-divider{height:1px;background:#30313b;margin:19px 0}
.dash-empty{padding:16px;background:#202128;border:1px dashed #454650;border-radius:12px;font-size:13px;color:#a7a8b4;line-height:1.55}
.stats-subheading{font-size:17px;font-weight:850;margin:0 0 13px}
@media(max-width:1120px){.dashboard-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-columns{grid-template-columns:1fr}}
@media(max-width:640px){.dashboard-top{align-items:flex-start}.dashboard-hero{padding:20px 17px;gap:14px}.dashboard-hero h2{font-size:23px}.hero-ring{width:105px;height:105px;flex-basis:105px}.hero-ring:before{inset:9px}.hero-ring strong{font-size:26px}.hero-ring small{font-size:8px}.hero-buttons .btn{font-size:12px;padding:10px}.dashboard-metrics{gap:9px}.metric-tile{padding:12px 10px;gap:9px}.metric-icon{width:33px;height:33px;flex-basis:33px;font-size:17px}.metric-number{font-size:23px}.metric-caption{font-size:10px}.dashboard-panel{padding:16px}.stats-feature{grid-template-columns:1fr;gap:14px}.stats-donut{width:148px;height:148px}.stats-donut:before{inset:21px}.publisher-row{grid-template-columns:minmax(60px,1.05fr) minmax(80px,2fr) auto;gap:8px}.status-legend{gap:8px}}
@media(max-width:370px){.hero-ring{width:92px;height:92px;flex-basis:92px}.hero-ring strong{font-size:22px}.dashboard-hero{gap:6px}.dashboard-hero h2{font-size:21px}.metric-tile{display:block}.metric-icon{margin-bottom:8px}}

function applyBuyFilters(){
 const input=document.getElementById('buySearch');
 if(!input)return;
 const term=buySearch.trim().toLocaleLowerCase('it');
 let visibleTotal=0,visibleSeries=0;
 document.querySelectorAll('.buy-series').forEach(group=>{
  const seriesText=group.dataset.buySeriesSearch||'';
  let inGroup=0;
  group.querySelectorAll('.buy-volume').forEach(card=>{
   const num=card.dataset.buyVolume||'';
   const status=card.dataset.buyStatus||'non_pianificato';
   const searchMatch=!term||seriesText.includes(term)||num===term||('volume '+num).includes(term)||('vol '+num).includes(term);
   const statusMatch=buyOrderFilter==='tutti'||(buyOrderFilter==='da_ordinare'?status==='da_ordinare':status==='in_corso');
   const visible=searchMatch&&statusMatch;
   card.hidden=!visible;
   if(visible)inGroup++;
  });
  group.hidden=inGroup===0;
  if(inGroup){visibleSeries++;visibleTotal++;}
 });
 const counter=document.getElementById('buyResultCount');
 if(counter)counter.textContent=visibleTotal?visibleSeries+' serie trovate':'Nessun risultato. Prova un altro titolo o filtro.';
 const clear=document.querySelector('[data-buy-clear]');
 if(clear)clear.disabled=!buySearch;
}

function cloudConfigured(){
 const c=window.MANGALOG_CLOUD||{};
 return /^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(String(c.url||''))&&String(c.publishableKey||'').length>15;
}

 const status=cloudState==='synced'?'ok':cloudState==='error'||cloudBlocked?'error':'';
 const who=cloudUser?`<p class="cloud-account">${esc(cloudUser.email||'Account personale')}</p>`:'<p class="muted">Accedi per ritrovare gli stessi volumi su più dispositivi.</p>';
 const actions=cloudUser?`<button class="btn" data-action="cloudpull">↓ Scarica dal cloud</button><button class="btn" data-action="cloudpush">↑ Carica questa collezione</button><button class="btn" data-action="cloudretry">↻ Riprova</button><button class="btn" data-action="cloudlogout">Esci</button>`:`<button class="btn primary" data-action="cloudlogin">Accedi</button><button class="btn" data-action="cloudsignup">Crea account</button>`;
 return `<section class="cloud-panel"><h2>☁ MangaLog Cloud</h2>${who}<div class="cloud-indicator ${status}">${esc(cloudMessage)}</div><div class="cloud-bar">${actions}</div><p class="cloud-help">I volumi vengono sincronizzati automaticamente quando sei online e autenticato. Se due dispositivi modificano dati non aggiornati, la sincronizzazione si ferma per evitare sovrascritture: esporta un backup prima di scegliere quale copia conservare.</p></section>`;
}
function cloudNote(state,message){cloudState=state;cloudMessage=message;if(page==='settings')render()}
function cloudAuthModal(type){
 if(!cloudClient){alert('Il cloud non è configurato o la libreria di accesso non è disponibile.');return}
 const signup=type==='signup';
 modal(`<h2>${signup?'Crea account MangaLog':'Accedi a MangaLog'}</h2><p class="muted">Usa un indirizzo email valido. La password deve avere almeno 8 caratteri.</p><form id="cloudAuthForm"><div class="field full"><label>Email</label><input class="input" type="email" name="email" autocomplete="email" required maxlength="254"></div><div class="field full"><label>Password</label><input class="input" type="password" name="password" minlength="8" autocomplete="${signup?'new-password':'current-password'}" required></div><div class="actions"><button class="btn" type="button" data-action="close">Annulla</button><button class="btn primary" type="submit">${signup?'Registrati':'Accedi'}</button></div><p class="small-note" id="cloudAuthFeedback" role="status"></p></form>`);
 document.getElementById('cloudAuthForm').onsubmit=async e=>{
  e.preventDefault();const f=new FormData(e.target);const email=String(f.get('email')).trim(),password=String(f.get('password'));
  const btn=e.target.querySelector('[type=submit]'),msg=document.getElementById('cloudAuthFeedback');btn.disabled=true;msg.textContent='Attendi…';
  try{
   const result=signup?await cloudClient.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}}):await cloudClient.auth.signInWithPassword({email,password});
   if(result.error)throw result.error;
   if(!result.data.session){msg.textContent='Controlla la tua email e conferma la registrazione, poi torna qui e accedi.';return}
   close();await cloudSwitch(result.data.session);
  }catch(err){msg.textContent='Accesso non riuscito: '+String(err.message||err).slice(0,180)}finally{btn.disabled=false}
 };

async function cloudInit(){
 if(!cloudConfigured()){cloudNote('offline','Cloud da configurare');return}
 if(!window.supabase||!window.supabase.createClient){cloudNote('error','Connessione alla libreria cloud non disponibile');return}
 try{
  const c=window.MANGALOG_CLOUD;
  cloudClient=window.supabase.createClient(c.url,c.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  cloudNote('offline','Controllo sessione…');
  const {data:sessionData,error}=await cloudClient.auth.getSession();
  if(error)throw error;
  if(sessionData.session)await cloudSwitch(sessionData.session);
  else cloudNote('offline','Modalità locale · accesso non effettuato');
  cloudClient.auth.onAuthStateChange((event,session)=>{
   if(event==='INITIAL_SESSION'||event==='TOKEN_REFRESHED')return;
   if(event==='SIGNED_IN'&&session&&cloudUser?.id!==session.user.id)setTimeout(()=>cloudSwitch(session),0);
   if(event==='SIGNED_OUT'&&cloudUser)setTimeout(()=>cloudResetToGuest(),0);
  });
 }catch(err){cloudNote('error','Cloud non raggiungibile: '+String(err.message||err).slice(0,120))}
}
function cloudResetToGuest(){
 clearTimeout(cloudTimer);cloudUser=null;cloudRevision=null;cloudLoadingUserId=null;cloudReady=false;cloudBlocked=false;undoStack=[];
 data={series:[],wishlist:[],activity:[]};load();lastSavedJSON=JSON.stringify(data);cloudNote('offline','Modalità locale · accesso non effettuato');render();
}
async function cloudSwitch(session){
 if(!session||!session.user||!cloudClient)return;
 if(cloudUser?.id===session.user.id&&(cloudReady||cloudLoadingUserId===session.user.id))return;
 cloudLoadingUserId=session.user.id;
 clearTimeout(cloudTimer);cloudUser=session.user;cloudReady=false;cloudBlocked=false;cloudRevision=null;undoStack=[];
 const guestBackup=localStorage.getItem(KEY);
 let cached=null;
 try{cached=localStorage.getItem('mangalog_cloud_local_'+cloudUser.id)}catch(_){}
 data={series:[],wishlist:[],activity:[]};if(cached)restoreSnapshot(cached);
 lastSavedJSON=JSON.stringify(data);render();
 cloudNote('offline','Accesso riuscito · carico la collezione…');
 try{
  const {data:remote,error}=await cloudClient.from('mangalog_collections').select('payload,revision').eq('user_id',cloudUser.id).maybeSingle();
  if(error)throw error;
  if(remote){
   restoreSnapshot(JSON.stringify(remote.payload));cloudRevision=remote.revision;lastSavedJSON=JSON.stringify(data);
   localStorage.setItem('mangalog_cloud_local_'+cloudUser.id,lastSavedJSON);
   cloudReady=true;cloudNote('synced','Collezione aggiornata dal cloud');render();
  }else{
   data={series:[],wishlist:[],activity:[]};lastSavedJSON=JSON.stringify(data);
   cloudReady=true;cloudNote('synced','Account nuovo · collezione cloud vuota');render();
   if(guestBackup){
    const g=JSON.parse(guestBackup);
    if(Array.isArray(g.series)&&g.series.length&&confirm('Vuoi caricare nel tuo nuovo account cloud la collezione già salvata in questo browser?')){
     restoreSnapshot(guestBackup);lastSavedJSON=JSON.stringify(data);
     localStorage.setItem('mangalog_cloud_local_'+cloudUser.id,lastSavedJSON);
     await cloudPush(true);render();
    }
   }
  }
 }catch(err){
  cloudReady=false;cloudNote('error','Impossibile leggere il cloud: '+String(err.message||err).slice(0,110));
  alert('Connessione o database non disponibile. I dati del cloud NON verranno sovrascritti. Controlla configurazione, tabella SQL e connessione.');
 } finally {cloudLoadingUserId=null}
}
function queueCloudPush(){
 if(!cloudUser)return;
 if(!cloudReady||cloudBlocked){cloudNote('error','Modifiche salvate sul dispositivo, ma cloud non sincronizzato');return}
 clearTimeout(cloudTimer);cloudNote('offline','Modifiche in attesa di sincronizzazione…');
 cloudTimer=setTimeout(()=>cloudSerial=cloudSerial.then(()=>cloudPush(false)).catch(e=>console.warn(e)),850);
}
async function cloudPush(force){
 if(!cloudClient||!cloudUser||!cloudReady)return;
 if(cloudBlocked&&!force)return;
 const uid=cloudUser.id,rev=cloudRevision,payload=JSON.parse(JSON.stringify(data));
 cloudNote('offline','Sincronizzazione in corso…');
 try{
  let response;
  if(rev===null){
   response=await cloudClient.from('mangalog_collections').insert({user_id:uid,payload,revision:1}).select('revision').single();
  }else{
   response=await cloudClient.from('mangalog_collections').update({payload,revision:rev+1,updated_at:new Date().toISOString()}).eq('user_id',uid).eq('revision',rev).select('revision').maybeSingle();
  }
  if(response.error)throw response.error;
  if(!response.data){cloudBlocked=true;cloudNote('error','Conflitto: un altro dispositivo ha modificato la collezione');return}
  if(cloudUser?.id!==uid)return;
  cloudRevision=response.data.revision;cloudBlocked=false;
  if(JSON.stringify(data)!==JSON.stringify(payload)){queueCloudPush();return}
  cloudNote('synced','✓ Collezione sincronizzata');
 }catch(err){
  if(String(err.code||'')==='23505'){cloudBlocked=true;cloudNote('error','Conflitto cloud: dati già presenti da un altro dispositivo')}
  else cloudNote('error','Cloud non sincronizzato: '+String(err.message||err).slice(0,120));
 }
}
async function cloudPullWithConfirm(){
 if(!cloudClient||!cloudUser)return;
 if(!confirm('Scaricare i dati dal cloud e SOSTITUIRE quelli visibili in questa app? Esporta prima un backup se hai modifiche non sincronizzate.'))return;
 clearTimeout(cloudTimer);await cloudSerial;
 cloudReady=false;
 try{
  const {data:remote,error}=await cloudClient.from('mangalog_collections').select('payload,revision').eq('user_id',cloudUser.id).maybeSingle();
  if(error)throw error;
  restoreSnapshot(remote?JSON.stringify(remote.payload):JSON.stringify({series:[],wishlist:[],activity:[]}));
  cloudRevision=remote?remote.revision:null;lastSavedJSON=JSON.stringify(data);undoStack=[];cloudBlocked=false;cloudReady=true;
  localStorage.setItem('mangalog_cloud_local_'+cloudUser.id,lastSavedJSON);cloudNote('synced','Dati scaricati dal cloud');render();
 }catch(err){cloudReady=false;cloudNote('error','Errore scaricamento: '+String(err.message||err).slice(0,120))}
}
async function cloudPushWithConfirm(){
 if(!cloudClient||!cloudUser||!cloudReady){alert('Accedi e attendi il caricamento del cloud.');return}
 if(!confirm('Caricare QUESTA collezione nel cloud? Verranno sostituiti i dati remoti. Usa prima Esporta backup se non sei sicuro.'))return;
 clearTimeout(cloudTimer);await cloudSerial;
 try{
  const {data:remote,error}=await cloudClient.from('mangalog_collections').select('revision').eq('user_id',cloudUser.id).maybeSingle();
  if(error)throw error;
  cloudRevision=remote?remote.revision:null;cloudBlocked=false;await cloudPush(true);
 }catch(err){cloudNote('error','Errore: '+String(err.message||err).slice(0,120))}
}
async function cloudRetry(){
 if(!cloudClient||!cloudUser)return;
 if(!cloudReady){const {data:d}=await cloudClient.auth.getSession();if(d.session)await cloudSwitch(d.session);return}
 if(cloudBlocked){alert('Conflitto rilevato. Esporta un backup, poi scegli Scarica dal cloud o Carica questa collezione.');return}
 clearTimeout(cloudTimer);await cloudSerial;cloudSerial=cloudSerial.then(()=>cloudPush(false));
}
async function cloudLogout(){
 if(!cloudClient)return;
 if(cloudState!=='synced'&&cloudReady&&!confirm('Potrebbero esserci modifiche non sincronizzate. Vuoi comunque uscire?'))return;
 clearTimeout(cloudTimer);
 const uid=cloudUser?.id;const {error}=await cloudClient.auth.signOut();
 if(error){alert('Non è stato possibile uscire: '+error.message);return}
 if(uid)try{localStorage.removeItem('mangalog_cloud_local_'+uid)}catch(_){}
 cloudResetToGuest();
}

function close(){ $('#modalBack').classList.remove('show')}function modal(html){$('#modalContent').innerHTML=html;$('#modalBack').classList.add('show')}function edit(id,fromWishlist=null){const s=data.series.find(x=>x.id===id);modal(`<h2>${s?'Modifica serie':'Nuova serie'}</h2><p class="muted">Inserisci i dati della tua edizione italiana.</p><form id="seriesForm"><div class="form-grid"><div class="field full"><label>Titolo della serie *</label><input class="input" name="title" maxlength="120" required value="${esc(s?.title||fromWishlist?.title||'')}" placeholder="Es. One Piece"></div><div class="field"><label>Edizione</label><input class="input" name="edition" maxlength="100" value="${esc(s?.edition||'Edizione regolare')}"></div><div class="field"><label>Editore</label><input class="input" name="publisher" maxlength="100" value="${esc(s?.publisher||'')}"></div><div class="field"><label>Autore</label><input class="input" name="author" maxlength="100" value="${esc(s?.author||'')}"></div><div class="field"><label>Volumi pubblicati / previsti *</label><input class="input" type="number" name="total" min="1" max="2000" required value="${s?.total||1}"></div><div class="field full"><label>Note</label><textarea class="input" name="notes" rows="3" maxlength="1200">${esc(s?.notes||fromWishlist?.notes||'')}</textarea></div></div><div class="actions"><button class="btn" type="button" data-action="close">Annulla</button><button class="btn primary" type="submit">Salva serie</button></div></form>`);$('#seriesForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const title=String(f.get('title')).trim(),total=Number(f.get('total'));if(!title||!Number.isInteger(total)||total<1||total>2000)return alert('Inserisci un titolo e un numero valido di volumi.');const obj=norm({id:s?.id||uid(),title,total,edition:String(f.get('edition')).trim(),publisher:String(f.get('publisher')).trim(),author:String(f.get('author')).trim(),notes:String(f.get('notes')).trim(),owned:s?.owned||[],purchasePlans:s?.purchasePlans||{},created:s?.created||Date.now()});if(s)data.series[data.series.indexOf(s)]=obj;else data.series.push(obj);if(fromWishlist)data.wishlist=data.wishlist.filter(w=>w.id!==fromWishlist.id);close();page='detail';selected=obj.id;save()}}
function wishAdd(id=null){
 const w=data.wishlist.find(x=>x.id===id)||null;
 modal(`<h2>${w?'Modifica desiderio':'Nuovo desiderio'}</h2><p class="helper-note">Organizza le serie che vorresti iniziare. I prezzi sono facoltativi e vengono inseriti da te.</p><form id="wishForm"><div class="form-grid"><div class="field full"><label>Serie / edizione desiderata *</label><input class="input" name="title" required maxlength="120" value="${esc(w?.title||'')}" placeholder="Es. Naruto Deluxe"></div><div class="field"><label>Priorità</label><select class="input" name="priority">${['alta','media','bassa'].map(p=>`<option value="${p}" ${w?.priority===p?'selected':''}>${priorityLabels[p]}</option>`).join('')}</select></div><div class="field"><label>Prezzo indicativo (€)</label><input class="input" name="price" inputmode="decimal" placeholder="Es. 49,90" value="${w?.price===null||w?.price===undefined?'':esc(String(w.price).replace('.',','))}"></div><div class="field full"><label>Note</label><textarea class="input" name="notes" rows="3" maxlength="300" placeholder="Edizione, volumi che vorresti, negozio…">${esc(w?.notes||'')}</textarea></div></div><div class="actions"><button type="button" class="btn" data-action="close">Annulla</button><button class="btn primary" type="submit">Salva desiderio</button></div></form>`);
