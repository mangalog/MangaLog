.hero-ring-content{position:relative;display:flex;flex-direction:column;text-align:center}
.hero-ring strong{font-size:35px;line-height:1;font-weight:950;color:#fff}
.hero-ring small{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#b1a3ab;margin-top:7px}
.dashboard-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:15px}
.metric-tile{min-width:0;background:linear-gradient(145deg,#1e2028,#17181e);border:1px solid #31323e;border-radius:15px;padding:16px;display:flex;align-items:center;gap:12px}
.metric-icon{flex:0 0 39px;width:39px;height:39px;border-radius:11px;background:#47212e;color:#ff6076;display:grid;place-items:center;font-size:21px;font-weight:900}
.metric-tile:nth-child(2) .metric-icon{background:#21382e;color:#8bdeb1}.metric-tile:nth-child(3) .metric-icon{background:#202d40;color:#92b3f6}.metric-tile:nth-child(4) .metric-icon{background:#352743;color:#cba0ff}
.metric-number{font-size:26px;line-height:1.06;font-weight:950;color:#fff;overflow-wrap:anywhere}
.metric-caption{font-size:11px;color:#a4a5b2;margin-top:5px}
.dashboard-columns{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:15px;margin-top:19px}
.dashboard-panel{background:#18191f;border:1px solid #30323b;border-radius:17px;padding:20px;min-width:0}
.dashboard-panel h3{margin:0;font-size:17px;letter-spacing:-.2px}
.dashboard-panel .sub{color:#a1a2ae;font-size:12px;margin:5px 0 0;line-height:1.5}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.panel-head .btn{white-space:nowrap}
.overall-progress{height:12px;background:#35363e;border-radius:100px;overflow:hidden;margin:15px 0 9px}
.overall-progress>i{display:block;height:100%;background:linear-gradient(90deg,#f23650,#ff7990);border-radius:100px}
.progress-pair{display:flex;justify-content:space-between;gap:14px;color:#b8b8c2;font-size:12px;margin:7px 0}
.progress-pair strong{color:#fff}
.status-track{display:flex;height:13px;background:#31323b;border-radius:100px;overflow:hidden;margin:14px 0 14px}
.status-track .complete{background:#fe4c64}.status-track .started{background:#9b5370}.status-track .unstarted{background:#52545f}
.status-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#bfc0ca}
.status-legend b{color:#fff;font-weight:800}
.status-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:#fe4c64}
.status-legend .start i{background:#9b5370}.status-legend .none i{background:#52545f}
.dashboard-links{display:grid;gap:9px}
.dashboard-link{border:1px solid #34353e;background:#202129;border-radius:11px;padding:11px 12px;color:#fff;text-align:left;display:flex;gap:12px;align-items:center;width:100%}
.dashboard-link:hover,.dashboard-link:focus-visible{border-color:#fa6378;background:#29212b;outline:none}
.dash-cover{display:grid;place-items:center;width:43px;height:55px;border-radius:5px;background:linear-gradient(135deg,#673044,#261d28);font-weight:950;color:#ff8fa0;font-size:13px;flex-shrink:0}
.dash-link-main{min-width:0;flex:1}.dash-link-title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.dash-link-meta{font-size:11px;color:#9fa0ae;margin-top:5px}.dash-link-right{color:#ff6b7f;font-weight:850;font-size:13px;white-space:nowrap}
.dash-mini-progress{height:5px;background:#34353e;overflow:hidden;border-radius:12px;margin-top:8px}
.dash-mini-progress i{height:100%;background:#f64b64;display:block;border-radius:12px}
.activity-list{display:grid;gap:9px}
.activity-item{display:flex;gap:11px;align-items:center;border-bottom:1px solid #30313a;padding:4px 0 12px}.activity-item:last-child{border:0;padding-bottom:0}
.activity-symbol{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#2b2330;color:#ff8496;flex-shrink:0}
.activity-title{font-weight:750;font-size:13px;line-height:1.4}.activity-date{font-size:11px;color:#9697a5;margin-top:3px}
.section-link{border:0;background:transparent;color:#ff8191;font-size:12px;font-weight:800;padding:5px 0;cursor:pointer}
.stats-feature{display:grid;grid-template-columns:200px 1fr;align-items:center;gap:26px}
.stats-donut{width:175px;height:175px;border-radius:50%;position:relative;background:conic-gradient(#f44760 var(--pct),#3b3d47 0);display:grid;place-items:center;margin:auto}
.stats-donut:before{content:'';position:absolute;inset:24px;border-radius:50%;background:#18191f}
.stats-donut-center{position:relative;text-align:center}.stats-donut-center strong{display:block;font-weight:950;font-size:31px}.stats-donut-center small{display:block;font-size:11px;color:#a8a9b5}
.publisher-chart{display:grid;gap:18px}
.publisher-row{display:grid;grid-template-columns:minmax(75px,1.2fr) minmax(70px,3fr) auto;align-items:center;gap:14px}
.publisher-name{font-size:12px;color:#e1e1e6;overflow-wrap:anywhere}
.publisher-track{height:11px;background:#393a44;border-radius:99px;overflow:hidden;display:flex}
.publisher-track i{display:block;background:#fb526a;height:100%}.publisher-track em{display:block;background:#66515d;height:100%;font-style:normal}
.publisher-total{font-size:11px;color:#afb0bb;white-space:nowrap;text-align:right}
.stats-divider{height:1px;background:#30313b;margin:19px 0}
.dash-empty{padding:16px;background:#202128;border:1px dashed #454650;border-radius:12px;font-size:13px;color:#a7a8b4;line-height:1.55}
.stats-subheading{font-size:17px;font-weight:850;margin:0 0 13px}
@media(max-width:1120px){.dashboard-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-columns{grid-template-columns:1fr}}
@media(max-width:640px){.dashboard-top{align-items:flex-start}.dashboard-hero{padding:20px 17px;gap:14px}.dashboard-hero h2{font-size:23px}.hero-ring{width:105px;height:105px;flex-basis:105px}.hero-ring:before{inset:9px}.hero-ring strong{font-size:26px}.hero-ring small{font-size:8px}.hero-buttons .btn{font-size:12px;padding:10px}.dashboard-metrics{gap:9px}.metric-tile{padding:12px 10px;gap:9px}.metric-icon{width:33px;height:33px;flex-basis:33px;font-size:17px}.metric-number{font-size:23px}.metric-caption{font-size:10px}.dashboard-panel{padding:16px}.stats-feature{grid-template-columns:1fr;gap:14px}.stats-donut{width:148px;height:148px}.stats-donut:before{inset:21px}.publisher-row{grid-template-columns:minmax(60px,1.05fr) minmax(80px,2fr) auto;gap:8px}.status-legend{gap:8px}}
@media(max-width:370px){.hero-ring{width:92px;height:92px;flex-basis:92px}.hero-ring strong{font-size:22px}.dashboard-hero{gap:6px}.dashboard-hero h2{font-size:21px}.metric-tile{display:block}.metric-icon{margin-bottom:8px}}

/* v8 advanced management */
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.advanced-panel,.advanced-note{
  margin:18px 0 22px;
  background:rgba(21,22,28,.92);
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px;
  padding:18px;
  box-shadow:0 14px 34px rgba(0,0,0,.18);
}
.advanced-panel h3,.advanced-note h3{margin:0 0 6px}
.advanced-note p{margin:0;color:#d7d9de;line-height:1.6}
.quick-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.quick-actions .btn{min-height:42px}
.inline-actions{display:flex;gap:10px;flex-wrap:wrap}
.small-note{font-size:12px;color:#aeb3bd;margin-top:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}


/* MangaLog v8.2 — leggibilità e usabilità */
:root{--mt-accent:#ff5369;--mt-focus:#ff98a7;--mt-panel:#1c1e26}
button,input,select,textarea{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role="button"]:focus-visible,summary:focus-visible{outline:3px solid var(--mt-focus)!important;outline-offset:3px}
.btn,.view-btn,.chip,.nav,.missing-number,.volume{transition:background-color .15s ease,border-color .15s ease,filter .15s ease,transform .15s ease}
.btn{min-height:42px;line-height:1.25;border-color:#4b4e5a;background:#23252d}
.btn.primary{background:#ec3d53;border-color:#ff6277;color:#fff}
.btn.small{min-height:39px;padding:9px 13px;font-size:12px}
.btn:active:not(:disabled),.chip:active,.volume:active,.missing-number:active{transform:scale(.98)}
.top{gap:18px;flex-wrap:wrap;align-items:flex-end}
.top>.inline-actions{margin-left:auto}
.heading{line-height:1.12;letter-spacing:-1.1px}
.eyebrow{color:#ff7287}
.muted,.dashboard-intro{color:#b7bac5}
.dashboard-panel,.advanced-panel,.advanced-note,.detail-hero{border-color:#3b3e49}
.advanced-panel{padding:20px;border-radius:17px;margin-top:20px}
.advanced-panel .panel-head{margin-bottom:5px}
.advanced-panel .sub{color:#b6bac4;line-height:1.5}
.quick-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.quick-actions .btn{text-align:center;white-space:normal;min-height:44px}
.small-note{line-height:1.55;color:#b8bac4}
.detail-meta>div{background:rgba(10,11,16,.26);border:1px solid #353944;border-radius:11px;padding:11px 12px}
.detail-meta strong{display:block;overflow-wrap:anywhere}
.detail-meta small{color:#abb1bd}
.detail-actions{margin-top:14px}
.detail-actions .btn{min-height:41px}
.volume-grid{gap:10px}
.volume{border-color:#474b59!important;background:#272a34;color:#fff!important}
.volume-number{color:#fff!important;font-weight:900;font-variant-numeric:tabular-nums}
.volume.owned{border-color:#fa657b!important;background:linear-gradient(135deg,#693044,#39212b)}
.volume small{color:#c7cbd2}
.volume.owned small{color:#ffd7df}
.missing-number{color:#fff!important;border-color:#4d515e;background:#262932;font-variant-numeric:tabular-nums}
.missing-number.selected{color:#fff!important;background:#b52f49}
.missing-number:focus-visible,.volume:focus-visible{outline:3px solid #ff98a7!important}
.collection-controls{margin-top:8px}
.toolbar{align-items:stretch}
.toolbar .input{border-color:#555967;background:#22242c;color:#f9f9fa}
.search-wrap{display:flex;gap:8px;flex:1;min-width:220px}
.search-wrap .input{flex:1;min-width:0;width:100%}
.search-clear{flex-shrink:0;min-width:66px}
.search-clear:disabled{visibility:hidden}
.results-count{color:#c6c8d1}
.modal{border-color:#595e6b;box-shadow:0 30px 80px #000a}
.form-grid .field label{color:#d6d7dd}
@media(max-width:800px){
 .main{padding:20px 16px calc(112px + env(safe-area-inset-bottom));}
 .mobile-nav{border-top-color:#50515c;box-shadow:0 -12px 35px #0008;background:rgba(21,22,29,.96)}
 .mobile-nav button{min-width:0;flex:1;min-height:52px;color:#c8c8d0}
 .mobile-nav button.active{color:#ff657b;font-weight:800}
 .top>.inline-actions{width:100%;margin-left:0}
 .top>.inline-actions .btn{flex:1}
 .detail-meta{gap:8px}
 .detail-meta>div{padding:10px}
 .quick-actions{grid-template-columns:repeat(2,minmax(0,1fr))}
 .quick-actions .btn{padding:10px 7px;font-size:12px}
 .advanced-panel{padding:15px}
 .search-wrap{width:100%}
}
@media(max-width:380px){
 .quick-actions{grid-template-columns:1fr 1fr}
 .heading{font-size:27px}
 .detail-meta{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(prefers-reduced-motion:reduce){.btn,.view-btn,.chip,.nav,.missing-number,.volume{transition:none!important}}

/* MangaLog v8.3 — quick purchase and order lookup */
.buy-volume[hidden],.buy-series[hidden]{display:none!important}
.buy-finder{background:#17191f;border:1px solid #383b45;border-radius:16px;padding:16px;margin:14px 0 20px}
.buy-finder-label{display:block;font-size:13px;font-weight:750;color:#e7e8ed;margin-bottom:9px}
.buy-finder-row{display:flex;gap:9px;align-items:center}
.buy-finder-row input{flex:1;min-width:0}
.buy-status-filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.order-tag{display:inline-flex;align-items:center;border-radius:30px;padding:5px 9px;font-size:11px;font-weight:800;color:#bec5d0;background:#2c3038}
.order-tag.order-progress{color:#ffe1b4;background:#674524}
.buy-volume-head{flex-wrap:wrap;gap:7px}
@media(max-width:520px){.buy-finder{padding:12px}.buy-finder-row .btn{padding:10px}}


/* MangaLog v10: personal accounts and cloud synchronization */
.cloud-panel{background:#1a1d24;border:1px solid #424753;border-radius:16px;padding:18px;margin:18px 0}
.cloud-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}
.cloud-indicator{font-weight:750;font-size:13px;border-radius:999px;background:#2a303a;color:#dce2eb;padding:7px 11px;display:inline-flex;gap:7px;align-items:center}
.cloud-indicator.ok{background:#183d32;color:#b8ffde}
.cloud-indicator.error{background:#53242c;color:#ffe0e4}
.cloud-help{font-size:12px;color:#aeb5c2;line-height:1.6;margin-top:12px}
.cloud-account{overflow-wrap:anywhere;color:#fff;font-weight:750}
.cloud-panel input{max-width:100%}
@media(max-width:600px){.cloud-panel{padding:13px}.cloud-bar .btn{flex:1;min-width:145px}}

/* v11 — Dashboard amministratore: accessibile esclusivamente dopo verifica RPC */
.admin-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0 24px}
.admin-metric{background:#1a1d25;border:1px solid #414550;border-radius:16px;padding:22px}
.admin-metric strong{display:block;font-size:clamp(25px,4vw,37px);color:#fff;font-variant-numeric:tabular-nums;margin:7px 0}
.admin-metric span{font-size:13px;color:#c9ccd6}
.admin-hint{background:#1b1d25;border:1px solid #444653;border-radius:13px;padding:17px;color:#c9ccd6;line-height:1.6}
.admin-actions{display:flex;gap:10px;flex-wrap:wrap;margin:13px 0}
@media(max-width:480px){.admin-metrics{grid-template-columns:1fr 1fr;gap:9px}.admin-metric{padding:13px}.admin-metric strong{font-size:26px}}


/* v12 — filtri discreti, volumi speciali, risultati dalla Home */
.metric-link{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%;position:relative;padding-right:19px}
.metric-link:hover{border-color:#fa667b;background:linear-gradient(145deg,#32212c,#19191f)}
.metric-link:after{content:'›';position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:22px;color:#ff7f94}
.metric-values{min-width:0;display:block}
.metric-number,.metric-caption{display:block}
.missing-quick-actions{display:flex;gap:8px;flex-wrap:wrap}
.missing-search-box{margin:12px 0 16px;border:1px solid #424753;border-radius:14px;background:#1a1c24;padding:13px}
.missing-search-box label{font-size:13px;display:block;margin-bottom:9px;font-weight:750}
.missing-search-box small{color:#abb4be;display:block;margin-top:8px}
.missing-search-controls{display:flex;gap:8px}
.missing-search-controls .input{flex:1;min-width:0;width:100%}
.missing-series[hidden],#missingSearchEmpty[hidden]{display:none!important}
.special-panel{margin:19px 0;padding:17px;background:#191b22;border:1px solid #3d414c;border-radius:16px}
.special-panel .section-head{margin:0 0 8px}
.special-panel .muted{font-size:12px;line-height:1.5;margin:0 0 14px}
.special-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px}
.special-volume{border:1px solid #4b505b;background:#252832;color:#fff;border-radius:11px;padding:13px 10px;text-align:left;display:flex;flex-direction:column;gap:8px}
.special-volume.owned{border-color:#fd617b;background:#442633}
.special-volume small{color:#bdc1ca}
.special-volume.owned small{color:#ffbaca}
.special-empty{font-size:13px;color:#b5b7c0;padding:7px 0}
.special-editor{background:#22242c;border:1px solid #414550;border-radius:13px;padding:14px;margin:17px 0}
.special-editor h3{margin:0 0 8px;font-size:16px}
.special-editor p{font-size:12px;line-height:1.55}
.special-edit-row{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;border-bottom:1px solid #3d424d;padding:13px 0;align-items:end}
.special-edit-row .field{min-width:0}
.special-owned-check{display:flex;align-items:center;gap:8px;font-size:13px;color:#e0e2e8}
.special-owned-check input{width:17px;height:17px;accent-color:#ee4256}
.special-edit-row [data-special-remove]{justify-self:end}
/* Finestra dedicata alla gestione variant, riquadri in scheda quando presenti */
.variant-new{padding:14px;background:#24252f;border:1px solid #454954;border-radius:13px;margin:17px 0}
.variant-new h3,.variant-existing h3{font-size:16px;margin:0 0 10px}
.variant-form-fields{margin:12px 0}
.variant-check{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:13px;color:#e0e2e8}
.variant-check input{width:17px;height:17px;accent-color:#ee4256}
.variant-existing{margin-top:22px}
.variant-existing .muted{font-size:12px;line-height:1.55}
.variant-manage-list{display:flex;flex-direction:column;gap:9px;margin-top:13px}
.variant-manage-row{padding:13px;background:#23252e;border:1px solid #414551;border-radius:12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.variant-desc{display:flex;flex-direction:column;min-width:0;gap:5px}
.variant-desc strong{color:#fff;overflow-wrap:anywhere}
.variant-desc small{color:#bdc1ca}
.variant-row-actions{display:flex;flex-wrap:wrap;gap:6px}
.special-empty{font-size:13px;color:#b5b7c0;padding:7px 0}
@media(max-width:520px){.variant-row-actions{width:100%}.variant-row-actions .btn{flex:1;padding:8px;font-size:12px}.variant-new{padding:12px}.variant-form-fields{grid-template-columns:1fr}}
.owned-list{padding:4px 18px}
.owned-row{font:inherit;color:#fff;background:none;border:0;border-bottom:1px solid #343743;display:flex;width:100%;align-items:center;gap:12px;padding:13px 4px;text-align:left}
.owned-row:last-child{border-bottom:0}
.owned-row:hover{background:#2a2530}
.owned-list-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.owned-list-main strong{font-size:14px;overflow-wrap:anywhere}
.owned-list-main small{font-size:12px;color:#b3b7c2}
.owned-row-arrow{font-size:24px;color:#ff8295}
@media(max-width:520px){.special-edit-row{grid-template-columns:77px minmax(0,1fr)}.special-panel{padding:12px}.special-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.special-edit-row [data-special-remove]{justify-self:start}}

/* La scelta è volutamente indipendente dai dati MangaLog e dal cloud. */
.theme-selector{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0 10px}
.theme-option{display:flex;gap:12px;align-items:center;text-align:left;min-width:0;border:2px solid #404655;background:#23262e;color:#f4f5f9;border-radius:14px;padding:12px;cursor:pointer;transition:border-color .15s ease,transform .15s ease}
.theme-option:hover{transform:translateY(-1px)}
.theme-option[aria-pressed="true"]{border-color:#ee4a63;box-shadow:0 0 0 2px #d9455f24}
.theme-option strong,.theme-option small{display:block}
.theme-option strong{font-size:14px}
.theme-option small{font-size:11px;font-weight:500;margin-top:4px;opacity:.78}
.theme-swatch{flex-shrink:0;width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:20px}
.theme-swatch.dark{background:linear-gradient(135deg,#10121b,#383043);color:#f47a89;border:1px solid #66505a}
.theme-swatch.light{background:linear-gradient(135deg,#fff,#cceaff);color:#086ba9;border:1px solid #89c4ea}
:root[data-theme="light"] .theme-option{background:#f7fbff;border-color:#c9dfec;color:#123a58}
:root[data-theme="light"] .theme-option[aria-pressed="true"]{border-color:#167fc1;box-shadow:0 0 0 2px #167fc11f}
@media(max-width:460px){.theme-selector{gap:8px}.theme-option{padding:9px;gap:8px}.theme-swatch{width:34px;height:38px}.theme-option small{font-size:10px}}


/* Leggibilità dei piccoli testi della griglia nel tema chiaro */
:root[data-theme="light"] .volume-legend{color:#4e6b83}
:root[data-theme="light"] .volume-legend .legend-dot:not(.legend-owned){background:#e5f0fa}

/* v12.5 · Area account sempre visibile sopra il contenuto, anche da smartphone */
.account-topbar{display:flex;align-items:center;justify-content:flex-end;gap:9px;min-height:42px;margin:-8px 0 18px}
.account-controls{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.account-topbar .account-btn{font-size:12px;line-height:1.1;padding:10px 13px;white-space:nowrap}
.account-user{display:inline-flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0;max-width:min(100%,330px);padding:10px 14px;border:1px solid #343640;border-radius:50px;background:#1b1c24;color:#f6f4f5;font-size:13px;font-weight:600}
.account-user-icon{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:25px;height:25px;border-radius:50%;background:#ed3e52;color:#fff;font-size:14px}
.account-user-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account-user-name strong{font-weight:850}
.cloud-profile-form{display:flex;flex-direction:column;gap:9px;margin:15px 0 19px;max-width:520px}
.cloud-profile-form label{font-size:12px;font-weight:750;color:#c2c3ca}
.cloud-profile-controls{display:flex;flex-wrap:wrap;gap:9px}
.cloud-profile-controls .input{min-width:170px;flex:1}
.cloud-profile-controls .btn{white-space:nowrap}
:root[data-theme="light"] .account-user{background:#f5faff;border-color:#c5d9e8;color:#18384f}

@media(max-width:800px){.account-topbar{margin:-9px 0 14px;min-height:38px}.account-topbar .account-btn{padding:9px 11px}.account-user{padding:7px 11px}}
/* Recupero password: link discreto, leggibile in entrambi i temi. */
.cloud-recovery-link{border:0;background:transparent;color:#ff8898;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px;font-weight:700;padding:8px 1px}

<script>
(()=>{'use strict';const KEY='mangatrack_v3_dark';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();let data={series:[],wishlist:[],activity:[]},page='home',selected=null,query='',sort='title',view=localStorage.getItem('mangatrack_view')==='list'?'list':'grid',filter='all';let undoStack=[],lastSavedJSON='',restoringHistory=false;let cloudClient=null,cloudUser=null,cloudRevision=null,cloudReady=false,cloudBlocked=false,cloudState='offline',cloudMessage='Modalità locale',cloudTimer=null,cloudSerial=Promise.resolve(),cloudLoadingUserId=null;let cloudIsAdmin=false,adminMetrics=null,adminError='',adminLoading=false;

let passwordRecoveryMode=new URLSearchParams(location.hash.slice(1)).get('type')==='recovery'||new URLSearchParams(location.search).get('type')==='recovery';const priorityLabels={alta:'Alta',media:'Media',bassa:'Bassa'};
const orderLabels={da_ordinare:'Da ordinare',in_corso:'Ordine in corso'};
const THEME_KEY='mangalog_appearance_v1';
const THEMES={tokyo:{name:'Tokyo Night',color:'#080f1a'},paper:{name:'Paper Manga',color:'#f8f6f1'},shogun:{name:'Shogun Red',color:'#0a0a0a'}};
function currentTheme(){const t=document.documentElement.getAttribute('data-theme');return Object.hasOwn(THEMES,t)?t:'tokyo'}

 const theme=Object.hasOwn(THEMES,value)?value:'tokyo';

 if(meta)meta.setAttribute('content',THEMES[theme].color);
 try{localStorage.setItem(THEME_KEY,theme)}catch(_){ }
 if(page==='settings')render();
}

const safeOrderStatus=v=>v==='in_corso'?'in_corso':'da_ordinare';
const priorityRank={alta:0,media:1,bassa:2};
const safePriority=v=>Object.hasOwn(priorityLabels,String(v))?String(v):'media';
function parsePrice(raw){
 if(raw===null||raw===undefined||String(raw).trim()==='')return null;
 const value=String(raw).trim().replace(',','.');
 if(!/^\d{1,6}(?:\.\d{1,2})?$/.test(value))return null;
 const n=Number(value);
 return Number.isFinite(n)&&n>=0&&n<=999999?Math.round(n*100)/100:null;
}
const euros=n=>n===null||n===undefined?'Da definire':new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n);
function normalizeWishlistItem(w){
 return {id:String(w.id||uid()),title:String(w.title||'').slice(0,120),notes:String(w.notes||'').slice(0,300),priority:safePriority(w.priority),price:parsePrice(w.price)};
}
function norm(o){
 const total=Math.max(1,Math.min(2000,Math.floor(Number(o.total)||1)));
 const owned=[...new Set((Array.isArray(o.owned)?o.owned:[]).map(Number).filter(n=>Number.isInteger(n)&&n>0&&n<=total))].sort((a,b)=>a-b);
 const purchasePlans={};
 if(o.purchasePlans&&typeof o.purchasePlans==='object'&&!Array.isArray(o.purchasePlans)){
  for(const [k,p] of Object.entries(o.purchasePlans)){
   const n=Number(k);
   if(!Number.isInteger(n)||n<1||n>total||owned.includes(n)||!p||typeof p!=='object')continue;
   purchasePlans[n]={priority:safePriority(p.priority),price:parsePrice(p.price),note:String(p.note||'').slice(0,250),status:safeOrderStatus(p.status)};
  }
 }
 const specialVolumes=[];
 const uniqueSpecials=new Set();

  if(uniqueSpecials.has(key))continue;
  uniqueSpecials.add(key);

 }
 specialVolumes.sort((a,b)=>a.number-b.number||a.label.localeCompare(b.label,'it'));
 return {id:String(o.id||uid()),title:String(o.title||'Senza titolo').slice(0,120),edition:String(o.edition||'Edizione regolare').slice(0,100),publisher:String(o.publisher||'Non specificato').slice(0,100),author:String(o.author||'').slice(0,100),total,owned,purchasePlans,specialVolumes,notes:String(o.notes||'').slice(0,1200),created:Number(o.created)||Date.now()};
}

function safeActivity(list){
 if(!Array.isArray(list))return [];
 return list.slice(-150).filter(a=>a&&typeof a.seriesId==='string'&&Number.isInteger(Number(a.volume))&&Number(a.volume)>0&&Number(a.volume)<=2000&&Number.isFinite(Number(a.at))).map(a=>({seriesId:String(a.seriesId).slice(0,200),volume:Number(a.volume),at:Number(a.at)})).sort((a,b)=>b.at-a.at).slice(0,120);
}
function registeredVolume(id,n){
 if(!data.activity)data.activity=[];
 data.activity=data.activity.filter(a=>!(a.seriesId===id&&a.volume===n));
 data.activity.unshift({seriesId:id,volume:n,at:Date.now()});

}
function unregisteredVolume(id,n){if(data.activity)data.activity=data.activity.filter(a=>!(a.seriesId===id&&a.volume===n))}
function recentRecordedVolumes(limit=5){
 return (data.activity||[]).map(a=>({...a,series:data.series.find(s=>s.id===a.seriesId)}))
   .filter(a=>a.series&&a.series.owned.includes(a.volume)).slice(0,limit);
}
function overviewTotals(){

 const regularOwned=data.series.reduce((n,s)=>n+s.owned.length,0),specialOwned=data.series.reduce((n,s)=>n+(s.specialVolumes||[]).filter(v=>v.owned).length,0);
 const owned=regularOwned+specialOwned,all=data.series.length,complete=completed();

 return {volumes,owned,regularOwned,specialOwned,missing:Math.max(0,volumes-regularOwned),all,complete,inProgress,notStarted:all-complete-inProgress,percent:volumes?Math.round(regularOwned/volumes*100):0};
}

async function cloudCheckAdmin(){
 cloudIsAdmin=false;adminMetrics=null;adminError='';
 if(!cloudClient||!cloudUser)return;
 const targetId=cloudUser.id;
 try{
  const {data:allowed,error}=await cloudClient.rpc('mangalog_is_admin');
  if(error)throw error;
  if(cloudUser?.id!==targetId)return;
  cloudIsAdmin=allowed===true;
  if(cloudIsAdmin)await adminRefresh();
  else render();
 }catch(err){cloudIsAdmin=false;adminError='La dashboard non è disponibile: verifica di aver eseguito lo script SQL v11.';console.warn('Admin role check:',err);render()}
}
async function adminRefresh(){
 if(!cloudClient||!cloudUser||!cloudIsAdmin)return;
 const targetId=cloudUser.id;
 adminLoading=true;if(page==='admin')render();
 try{
  const {data:metrics,error}=await cloudClient.rpc('mangalog_admin_stats');
  if(error)throw error;
  if(cloudUser?.id!==targetId)return;
  adminMetrics=metrics;adminError='';
 }catch(err){
  adminMetrics=null;adminError='Non riesco a leggere le statistiche. Riprova dopo aver verificato le funzioni SQL.';
  console.warn('Admin stats:',err);
 }finally{adminLoading=false;if(cloudUser?.id===targetId)render()}
}

function applyBuyFilters(){
 const input=document.getElementById('buySearch');
 if(!input)return;
 const term=buySearch.trim().toLocaleLowerCase('it');
 let visibleTotal=0,visibleSeries=0;
 document.querySelectorAll('.buy-series').forEach(group=>{
  const seriesText=group.dataset.buySeriesSearch||'';
  let inGroup=0;
  group.querySelectorAll('.buy-volume').forEach(card=>{
   const num=card.dataset.buyVolume||'';
   const status=card.dataset.buyStatus||'non_pianificato';
   const searchMatch=!term||seriesText.includes(term)||num===term||('volume '+num).includes(term)||('vol '+num).includes(term);
   const statusMatch=buyOrderFilter==='tutti'||(buyOrderFilter==='da_ordinare'?status==='da_ordinare':status==='in_corso');
   const visible=searchMatch&&statusMatch;
   card.hidden=!visible;
   if(visible)inGroup++;
  });
  group.hidden=inGroup===0;
  if(inGroup){visibleSeries++;visibleTotal++;}
 });
 const counter=document.getElementById('buyResultCount');
 if(counter)counter.textContent=visibleTotal?visibleSeries+' serie trovate':'Nessun risultato. Prova un altro titolo o filtro.';
 const clear=document.querySelector('[data-buy-clear]');

async function cloudInit(){
 if(!cloudConfigured()){cloudNote('offline','Cloud da configurare');return}
 if(!window.supabase||!window.supabase.createClient){cloudNote('error','Connessione alla libreria cloud non disponibile');return}
 try{
  const c=window.MANGALOG_CLOUD;
  cloudClient=window.supabase.createClient(c.url,c.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  cloudNote('offline','Controllo sessione…');
  // L'ascolto va installato prima di getSession: il callback recovery puo' arrivare durante lo scambio del token.
  cloudClient.auth.onAuthStateChange((event,session)=>{
   if(event==='PASSWORD_RECOVERY'){
    passwordRecoveryMode=true;
    setTimeout(()=>cloudNewPasswordModal(),0);
    return;
   }
   if(event==='INITIAL_SESSION'||event==='TOKEN_REFRESHED')return;
   if(event==='SIGNED_IN'&&session&&!passwordRecoveryMode&&cloudUser?.id!==session.user.id)setTimeout(()=>cloudSwitch(session),0);
   if(event==='SIGNED_OUT'&&cloudUser)setTimeout(()=>cloudResetToGuest(),0);
   if(event==='USER_UPDATED'&&session?.user){cloudUser=session.user;renderAccountTopbar()}
  });
  const {data:sessionData,error}=await cloudClient.auth.getSession();
  if(error)throw error;
  if(passwordRecoveryMode){
   if(sessionData.session){cloudNote('offline','Recupero password in corso');cloudNewPasswordModal()}
   else cloudNote('offline','Verifica del link di recupero in corso…');
  }else if(sessionData.session)await cloudSwitch(sessionData.session);
  else cloudNote('offline','Modalità locale · accesso non effettuato');
 }catch(err){cloudNote('error','Cloud non raggiungibile: '+String(err.message||err).slice(0,120))}
}
function cloudResetToGuest(){
 clearTimeout(cloudTimer);cloudUser=null;cloudRevision=null;cloudLoadingUserId=null;cloudReady=false;cloudBlocked=false;undoStack=[];cloudIsAdmin=false;adminMetrics=null;adminError='';if(page==='admin')page='home';
 data={series:[],wishlist:[],activity:[]};load();lastSavedJSON=JSON.stringify(data);cloudNote('offline','Modalità locale · accesso non effettuato');render();
}
async function cloudSwitch(session){
 if(!session||!session.user||!cloudClient)return;
 if(cloudUser?.id===session.user.id&&(cloudReady||cloudLoadingUserId===session.user.id))return;
 cloudLoadingUserId=session.user.id;
 clearTimeout(cloudTimer);cloudUser=session.user;cloudReady=false;cloudBlocked=false;cloudRevision=null;undoStack=[];cloudIsAdmin=false;adminMetrics=null;adminError='';if(page==='admin')page='home';
 const guestBackup=localStorage.getItem(KEY);
 let cached=null;
 try{cached=localStorage.getItem('mangalog_cloud_local_'+cloudUser.id)}catch(_){}
 data={series:[],wishlist:[],activity:[]};if(cached)restoreSnapshot(cached);
 lastSavedJSON=JSON.stringify(data);render();
 cloudNote('offline','Accesso riuscito · carico la collezione…');
 try{
  const {data:remote,error}=await cloudClient.from('mangalog_collections').select('payload,revision').eq('user_id',cloudUser.id).maybeSingle();
  if(error)throw error;
  if(remote){
   restoreSnapshot(JSON.stringify(remote.payload));cloudRevision=remote.revision;lastSavedJSON=JSON.stringify(data);
   localStorage.setItem('mangalog_cloud_local_'+cloudUser.id,lastSavedJSON);
   cloudReady=true;cloudNote('synced','Collezione aggiornata dal cloud');render();
  }else{
   data={series:[],wishlist:[],activity:[]};lastSavedJSON=JSON.stringify(data);
   cloudReady=true;cloudNote('synced','Account nuovo · collezione cloud vuota');render();
   if(guestBackup){
    const g=JSON.parse(guestBackup);
    if(Array.isArray(g.series)&&g.series.length&&confirm('Vuoi caricare nel tuo nuovo account cloud la collezione già salvata in questo browser?')){
     restoreSnapshot(guestBackup);lastSavedJSON=JSON.stringify(data);
     localStorage.setItem('mangalog_cloud_local_'+cloudUser.id,lastSavedJSON);
     await cloudPush(true);render();
    }
   }
  }
 }catch(err){
  cloudReady=false;cloudNote('error','Impossibile leggere il cloud: '+String(err.message||err).slice(0,110));
  alert('Connessione o database non disponibile. I dati del cloud NON verranno sovrascritti. Controlla configurazione, tabella SQL e connessione.');
 } finally {cloudLoadingUserId=null;if(cloudUser?.id===session.user.id)await cloudCheckAdmin()}
}
function queueCloudPush(){
 if(!cloudUser)return;
 if(!cloudReady||cloudBlocked){cloudNote('error','Modifiche salvate sul dispositivo, ma cloud non sincronizzato');return}
 clearTimeout(cloudTimer);cloudNote('offline','Modifiche in attesa di sincronizzazione…');
 cloudTimer=setTimeout(()=>cloudSerial=cloudSerial.then(()=>cloudPush(false)).catch(e=>console.warn(e)),850);
}
async function cloudPush(force){
 if(!cloudClient||!cloudUser||!cloudReady)return;
 if(cloudBlocked&&!force)return;
 const uid=cloudUser.id,rev=cloudRevision,payload=JSON.parse(JSON.stringify(data));
 cloudNote('offline','Sincronizzazione in corso…');
 try{
  let response;
  if(rev===null){
   response=await cloudClient.from('mangalog_collections').insert({user_id:uid,payload,revision:1}).select('revision').single();
  }else{
   response=await cloudClient.from('mangalog_collections').update({payload,revision:rev+1,updated_at:new Date().toISOString()}).eq('user_id',uid).eq('revision',rev).select('revision').maybeSingle();
  }
  if(response.error)throw response.error;
  if(!response.data){cloudBlocked=true;cloudNote('error','Conflitto: un altro dispositivo ha modificato la collezione');return}
  if(cloudUser?.id!==uid)return;
  cloudRevision=response.data.revision;cloudBlocked=false;
  if(JSON.stringify(data)!==JSON.stringify(payload)){queueCloudPush();return}
  cloudNote('synced','✓ Collezione sincronizzata');
 }catch(err){
  if(String(err.code||'')==='23505'){cloudBlocked=true;cloudNote('error','Conflitto cloud: dati già presenti da un altro dispositivo')}
  else cloudNote('error','Cloud non sincronizzato: '+String(err.message||err).slice(0,120));
 }
}

 clearTimeout(cloudTimer);await cloudSerial;
 cloudReady=false;
 try{
  const {data:remote,error}=await cloudClient.from('mangalog_collections').select('payload,revision').eq('user_id',cloudUser.id).maybeSingle();
  if(error)throw error;
  restoreSnapshot(remote?JSON.stringify(remote.payload):JSON.stringify({series:[],wishlist:[],activity:[]}));
  cloudRevision=remote?remote.revision:null;lastSavedJSON=JSON.stringify(data);undoStack=[];cloudBlocked=false;cloudReady=true;
  localStorage.setItem('mangalog_cloud_local_'+cloudUser.id,lastSavedJSON);cloudNote('synced','Dati scaricati dal cloud');render();
 }catch(err){cloudReady=false;cloudNote('error','Errore scaricamento: '+String(err.message||err).slice(0,120))}

async function cloudPushWithConfirm(){

 clearTimeout(cloudTimer);await cloudSerial;
 try{
  const {data:remote,error}=await cloudClient.from('mangalog_collections').select('revision').eq('user_id',cloudUser.id).maybeSingle();
  if(error)throw error;
  cloudRevision=remote?remote.revision:null;cloudBlocked=false;await cloudPush(true);
 }catch(err){cloudNote('error','Errore: '+String(err.message||err).slice(0,120))}
}
async function cloudRetry(){
 if(!cloudClient||!cloudUser)return;
 if(!cloudReady){const {data:d}=await cloudClient.auth.getSession();if(d.session)await cloudSwitch(d.session);return}
 if(cloudBlocked){alert('Conflitto rilevato. Esporta un backup, poi scegli Scarica dal cloud o Carica questa collezione.');return}
 clearTimeout(cloudTimer);await cloudSerial;cloudSerial=cloudSerial.then(()=>cloudPush(false));
}
async function cloudLogout(){
 if(!cloudClient)return;
 if(cloudState!=='synced'&&cloudReady&&!confirm('Potrebbero esserci modifiche non sincronizzate. Vuoi comunque uscire?'))return;
